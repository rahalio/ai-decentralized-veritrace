openapi: 3.1.0
info:
  title: Veritrace — Exports schemas
  version: 0.1.0
  description: ResearchExport schemas with ethics package summary and envelope responses.
paths: {}
components:
  schemas:
    ResearchExportStatus:
      type: string
      enum:
        - pending
        - ready
        - failed

    ConsentArtefactSummary:
      type: object
      description: Consent artefact included in an ethics-ready export package.
      required:
        - consentId
        - purpose
        - status
      properties:
        consentId:
          $ref: ./common/primitives.yaml#/components/schemas/ConsentId
        purpose:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [active, revoked, expired]
        expiresAt:
          type: string
          format: date-time
        learnerId:
          $ref: ./common/primitives.yaml#/components/schemas/LearnerId
        researcherId:
          $ref: ./common/primitives.yaml#/components/schemas/UserId

    NecessitySummary:
      type: object
      description: Necessity decision summary for ethics boards (no PII).
      properties:
        necessityDecisionId:
          $ref: ./common/primitives.yaml#/components/schemas/NecessityDecisionId
        spaceId:
          $ref: ./common/primitives.yaml#/components/schemas/SpaceId
        outcome:
          type: string
          enum: [permissioned, permissionless, no_chain]
        useBlockchain:
          type: boolean
        rationaleExcerpt:
          type: string
          maxLength: 500
        decidedAt:
          type: string
          format: date-time

    EthicsPackageSummary:
      type: object
      description: |
        Ethics-board oriented checklist for the export package contents
        (proofs, consent artefacts, necessity summary).
      required:
        - includesVerificationProofs
        - includesConsentArtefacts
        - includesNecessitySummary
        - blockCount
      properties:
        studyId:
          type: string
          maxLength: 100
        studyTitle:
          type: string
          maxLength: 300
        includesVerificationProofs:
          type: boolean
        includesConsentArtefacts:
          type: boolean
        includesNecessitySummary:
          type: boolean
        blockCount:
          type: integer
          minimum: 0
        validVerificationCount:
          type: integer
          minimum: 0
        noAnchorCount:
          type: integer
          minimum: 0
        mismatchCount:
          type: integer
          minimum: 0
        ethicsShareUrl:
          type: string
          format: uri
          description: Optional read-only share link for ethics board review.

    ResearchExport:
      type: object
      description: Verified research export package with proofs and consent artefacts.
      required:
        - exportId
        - consentId
        - status
        - blockIds
        - verificationIds
        - createdAt
        - updatedAt
      properties:
        exportId:
          $ref: ./common/primitives.yaml#/components/schemas/ExportId
        consentId:
          $ref: ./common/primitives.yaml#/components/schemas/ConsentId
        spaceId:
          $ref: ./common/primitives.yaml#/components/schemas/SpaceId
        researcherId:
          $ref: ./common/primitives.yaml#/components/schemas/UserId
        status:
          $ref: '#/components/schemas/ResearchExportStatus'
        blockIds:
          type: array
          items:
            $ref: ./common/primitives.yaml#/components/schemas/BlockId
        verificationIds:
          type: array
          items:
            $ref: ./common/primitives.yaml#/components/schemas/VerificationId
        consentArtefacts:
          type: array
          items:
            $ref: '#/components/schemas/ConsentArtefactSummary'
        necessitySummary:
          $ref: '#/components/schemas/NecessitySummary'
        ethicsPackage:
          $ref: '#/components/schemas/EthicsPackageSummary'
        downloadUrl:
          type: string
          format: uri
          description: Present when status is ready.
        failureDetail:
          type: string
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time

    ResearchExportCreate:
      type: object
      required:
        - consentId
        - blockIds
      properties:
        consentId:
          $ref: ./common/primitives.yaml#/components/schemas/ConsentId
        blockIds:
          type: array
          minItems: 1
          items:
            $ref: ./common/primitives.yaml#/components/schemas/BlockId
        verificationIds:
          type: array
          items:
            $ref: ./common/primitives.yaml#/components/schemas/VerificationId
          description: Optional pre-verified ids; server re-checks before packaging.
        studyId:
          type: string
          maxLength: 100
        studyTitle:
          type: string
          maxLength: 300
        allowNoAnchor:
          type: boolean
          default: false

    ResearchExportListData:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResearchExport'
        nextCursor:
          type: string

    ResearchExportResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ResearchExport'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    ResearchExportListResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ResearchExportListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
