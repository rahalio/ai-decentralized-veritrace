openapi: 3.1.0
info:
  title: Veritrace — Adapters schemas
  version: 0.1.0
  description: LbrEndpoint, LedgerAdapter, and LearnerLbrLinkage schemas with envelope responses.
paths: {}
components:
  schemas:
    AdapterHealthStatus:
      type: string
      enum:
        - healthy
        - degraded
        - down
        - disabled
        - unversioned

    LbrEndpointKind:
      type: string
      enum:
        - managed
        - self_hosted

    LbrEndpoint:
      type: object
      description: Registered Learning Block Repository endpoint (system of record for raw blocks).
      required:
        - lbrEndpointId
        - name
        - baseUrl
        - kind
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        lbrEndpointId:
          $ref: ./common/primitives.yaml#/components/schemas/LbrEndpointId
        name:
          type: string
          minLength: 1
          maxLength: 200
        baseUrl:
          type: string
          format: uri
        kind:
          $ref: '#/components/schemas/LbrEndpointKind'
        status:
          $ref: '#/components/schemas/AdapterHealthStatus'
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: Adapter / protocol version string.
        lastHealthCheckAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LbrEndpointCreate:
      type: object
      required:
        - name
        - baseUrl
        - kind
        - version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        baseUrl:
          type: string
          format: uri
        kind:
          $ref: '#/components/schemas/LbrEndpointKind'
        version:
          type: string
          minLength: 1
          maxLength: 64

    LbrEndpointUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        baseUrl:
          type: string
          format: uri
        kind:
          $ref: '#/components/schemas/LbrEndpointKind'
        status:
          $ref: '#/components/schemas/AdapterHealthStatus'
        version:
          type: string
          minLength: 1
          maxLength: 64

    PatchPlaybook:
      type: object
      description: Migration / vulnerability response playbook for a ledger adapter (BR-9).
      required:
        - title
        - steps
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          maxLength: 2000
        disableAnchoringDuringPatch:
          type: boolean
          default: true
        steps:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 1000
        runbookUrl:
          type: string
          format: uri

    LedgerAdapter:
      type: object
      description: |
        Versioned ledger adapter for opaque hash commitments only.
        Unversioned adapters should be treated as deploy-blocked in ops UX.
      required:
        - ledgerAdapterId
        - name
        - version
        - networkId
        - status
        - createdAt
        - updatedAt
      properties:
        ledgerAdapterId:
          $ref: ./common/primitives.yaml#/components/schemas/LedgerAdapterId
        name:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: string
          minLength: 1
          maxLength: 64
        networkId:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/AdapterHealthStatus'
        commitmentsOnly:
          type: boolean
          default: true
          description: Must remain true — adapter writes opaque hashes only.
        vulnerabilityBanner:
          type: string
          maxLength: 2000
        patchPlaybook:
          $ref: '#/components/schemas/PatchPlaybook'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LedgerAdapterCreate:
      type: object
      required:
        - name
        - version
        - networkId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: string
          minLength: 1
          maxLength: 64
        networkId:
          type: string
          minLength: 1
          maxLength: 100
        commitmentsOnly:
          type: boolean
          enum: [true]
          default: true
        patchPlaybook:
          $ref: '#/components/schemas/PatchPlaybook'

    LearnerLbrLinkageStatus:
      type: string
      enum:
        - linked
        - disconnected
        - pending_test

    LearnerLbrLinkage:
      type: object
      description: Learner-designated LBR linkage (platform not default custody of raw traces).
      required:
        - learnerId
        - lbrEndpointId
        - status
        - linkedAt
        - updatedAt
      properties:
        learnerId:
          $ref: ./common/primitives.yaml#/components/schemas/LearnerId
        lbrEndpointId:
          $ref: ./common/primitives.yaml#/components/schemas/LbrEndpointId
        status:
          $ref: '#/components/schemas/LearnerLbrLinkageStatus'
        connectionTestPassed:
          type: boolean
        platformCustodyNoticeAck:
          type: boolean
          description: Learner acknowledged that Veritrace will not keep raw traces by default.
        linkedAt:
          type: string
          format: date-time
        disconnectedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LearnerLbrLinkageCreate:
      type: object
      required:
        - lbrEndpointId
      properties:
        lbrEndpointId:
          $ref: ./common/primitives.yaml#/components/schemas/LbrEndpointId
        platformCustodyNoticeAck:
          type: boolean
          default: true
        runConnectionTest:
          type: boolean
          default: true

    LbrEndpointListData:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LbrEndpoint'
        nextCursor:
          type: string

    LbrEndpointResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/LbrEndpoint'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    LbrEndpointListResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/LbrEndpointListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    LedgerAdapterListData:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedgerAdapter'
        nextCursor:
          type: string

    LedgerAdapterResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/LedgerAdapter'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    LedgerAdapterListResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/LedgerAdapterListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    LearnerLbrLinkageResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/LearnerLbrLinkage'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
