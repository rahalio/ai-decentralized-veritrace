openapi: 3.1.0
info:
  title: Veritrace — Consents schemas
  version: 0.1.0
  description: ConsentGrant and AccessRequest schemas with envelope responses.
paths: {}
components:
  schemas:
    ConsentGrantStatus:
      type: string
      enum:
        - active
        - revoked
        - expired

    ConsentGrant:
      type: object
      description: Purpose-limited, time-boxed grant for researcher access to selected blocks.
      required:
        - consentId
        - learnerId
        - researcherId
        - purpose
        - expiresAt
        - status
        - blockIds
        - createdAt
        - updatedAt
      properties:
        consentId:
          $ref: ./common/primitives.yaml#/components/schemas/ConsentId
        learnerId:
          $ref: ./common/primitives.yaml#/components/schemas/LearnerId
        researcherId:
          $ref: ./common/primitives.yaml#/components/schemas/UserId
        accessRequestId:
          $ref: ./common/primitives.yaml#/components/schemas/AccessRequestId
        spaceId:
          $ref: ./common/primitives.yaml#/components/schemas/SpaceId
        purpose:
          type: string
          minLength: 1
          maxLength: 2000
        studyId:
          type: string
          maxLength: 100
          description: Optional ethics / IRB study identifier.
        expiresAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ConsentGrantStatus'
        blockIds:
          type: array
          minItems: 1
          items:
            $ref: ./common/primitives.yaml#/components/schemas/BlockId
        guardianApproved:
          type: boolean
          description: True when a minor path required guardian approval.
        revokedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConsentGrantCreate:
      type: object
      required:
        - learnerId
        - researcherId
        - purpose
        - expiresAt
        - blockIds
      properties:
        learnerId:
          $ref: ./common/primitives.yaml#/components/schemas/LearnerId
        researcherId:
          $ref: ./common/primitives.yaml#/components/schemas/UserId
        accessRequestId:
          $ref: ./common/primitives.yaml#/components/schemas/AccessRequestId
        spaceId:
          $ref: ./common/primitives.yaml#/components/schemas/SpaceId
        purpose:
          type: string
          minLength: 1
          maxLength: 2000
        studyId:
          type: string
          maxLength: 100
        expiresAt:
          type: string
          format: date-time
        blockIds:
          type: array
          minItems: 1
          items:
            $ref: ./common/primitives.yaml#/components/schemas/BlockId
        guardianApproved:
          type: boolean
          default: false

    AccessRequestStatus:
      type: string
      enum:
        - pending
        - granted
        - denied
        - expired

    AccessRequest:
      type: object
      description: Researcher request for purpose-limited access awaiting learner decision.
      required:
        - accessRequestId
        - learnerId
        - researcherId
        - purpose
        - expiresAt
        - status
        - createdAt
        - updatedAt
      properties:
        accessRequestId:
          $ref: ./common/primitives.yaml#/components/schemas/AccessRequestId
        learnerId:
          $ref: ./common/primitives.yaml#/components/schemas/LearnerId
        researcherId:
          $ref: ./common/primitives.yaml#/components/schemas/UserId
        spaceId:
          $ref: ./common/primitives.yaml#/components/schemas/SpaceId
        purpose:
          type: string
          minLength: 1
          maxLength: 2000
        studyId:
          type: string
          maxLength: 100
        studyTitle:
          type: string
          maxLength: 300
        expiresAt:
          type: string
          format: date-time
          description: Requested access window end (time box).
        activityIds:
          type: array
          items:
            $ref: ./common/primitives.yaml#/components/schemas/ActivityId
        blockIds:
          type: array
          items:
            $ref: ./common/primitives.yaml#/components/schemas/BlockId
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        decisionRationale:
          type: string
          maxLength: 2000
        resultingConsentId:
          $ref: ./common/primitives.yaml#/components/schemas/ConsentId
        decidedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccessRequestCreate:
      type: object
      required:
        - learnerId
        - researcherId
        - purpose
        - expiresAt
      properties:
        learnerId:
          $ref: ./common/primitives.yaml#/components/schemas/LearnerId
        researcherId:
          $ref: ./common/primitives.yaml#/components/schemas/UserId
        spaceId:
          $ref: ./common/primitives.yaml#/components/schemas/SpaceId
        purpose:
          type: string
          minLength: 1
          maxLength: 2000
        studyId:
          type: string
          maxLength: 100
        studyTitle:
          type: string
          maxLength: 300
        expiresAt:
          type: string
          format: date-time
        activityIds:
          type: array
          items:
            $ref: ./common/primitives.yaml#/components/schemas/ActivityId
        blockIds:
          type: array
          items:
            $ref: ./common/primitives.yaml#/components/schemas/BlockId

    AccessRequestDecide:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - approve
            - deny
        rationale:
          type: string
          maxLength: 2000
        expiresAt:
          type: string
          format: date-time
          description: Optional override of the grant window when approving.
        blockIds:
          type: array
          items:
            $ref: ./common/primitives.yaml#/components/schemas/BlockId
          description: Optional subset of blocks to grant when approving.
        guardianApproved:
          type: boolean
          default: false

    ConsentGrantListData:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsentGrant'
        nextCursor:
          type: string

    ConsentGrantResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ConsentGrant'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    ConsentGrantListResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ConsentGrantListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    AccessRequestListData:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessRequest'
        nextCursor:
          type: string

    AccessRequestResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AccessRequest'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    AccessRequestListResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AccessRequestListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
