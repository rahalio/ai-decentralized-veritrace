openapi: 3.1.0
info:
  title: Veritrace — Commitments API
  version: 0.1.0
  description: |
    Optional on-chain opaque hash anchors. Ledger payloads must never contain personal data.
  license:
    name: Proprietary
    url: https://veritrace.local/license
  x-domain: cmt
servers:
  - url: https://api.veritrace.local
    description: Local / starter API
security:
  - apiKey: []
tags:
  - name: Commitments
    description: Chain hash commitments (opaque anchors only)
paths:
  /v1/commitments:
    get:
      operationId: listCommitments
      tags: [Commitments]
      summary: List chain commitments
      x-dynamodb:
        entityType: "COMMITMENT"
        pkPatternTemplate: "COMMITMENT#${commitmentId}"
        skPatternTemplate: "METADATA"
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: blockId
          in: query
          required: false
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/BlockId
      responses:
        '200':
          description: Commitments page
          content:
            application/json:
              schema:
                $ref: ./commitments.schemas.yaml#/components/schemas/ChainCommitmentListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: anchorCommitment
      tags: [Commitments]
      summary: Anchor an opaque hash commitment
      description: |
        Write a content-hash commitment to the configured ledger. Rejected when the
        space has no necessity decision allowing blockchain, or when personal data
        would be included (`containsPersonalData` must be false).
      x-dynamodb:
        entityType: "COMMITMENT"
        pkPatternTemplate: "COMMITMENT#${commitmentId}"
        skPatternTemplate: "METADATA"
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./commitments.schemas.yaml#/components/schemas/ChainCommitmentCreate
      responses:
        '201':
          description: Commitment anchored
          content:
            application/json:
              schema:
                $ref: ./commitments.schemas.yaml#/components/schemas/ChainCommitmentResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/commitments/{commitmentId}:
    get:
      operationId: getCommitment
      tags: [Commitments]
      summary: Get chain commitment by id
      x-dynamodb:
        entityType: "COMMITMENT"
        pkPatternTemplate: "COMMITMENT#${commitmentId}"
        skPatternTemplate: "METADATA"
      parameters:
        - name: commitmentId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/CommitmentId
      responses:
        '200':
          description: Commitment
          content:
            application/json:
              schema:
                $ref: ./commitments.schemas.yaml#/components/schemas/ChainCommitmentResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
